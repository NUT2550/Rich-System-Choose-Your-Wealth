<!DOCTYPE html>

<title>Rich System Prototype</title>
<style>
* { box-sizing: border-box; }
body { 
    margin: 0; 
    padding: 20px; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: radial-gradient(circle at top right, #1a1a2e, #0f0f12);
    color: #fff; 
    min-height: 100vh;
}
h1 { color: #FFD700; margin-top: 0; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
h2 { color: #eee; margin: 0 0 10px; font-size: 18px; border-bottom: 1px solid #333; padding-bottom: 8px; }
.hidden { display: none !important; }

/* Start & Gender Screen */
.start-screen, .gender-screen {
    position: fixed; inset: 0; 
    background: radial-gradient(circle at center, #1a1a2e, #050508); 
    z-index: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
}
.start-screen h1, .gender-screen h1 { font-size: 40px; margin-bottom: 6px; color: #FFD700; }
.start-sub, .gender-sub { color: #aaa; margin-bottom: 24px; font-size: 16px; }

.system-grid, .gender-grid { 
    display: grid; 
    grid-template-columns: repeat(2, minmax(220px, 280px)); 
    gap: 16px; 
    width: 100%; max-width: 600px;
}
@media(max-width: 640px){ .system-grid, .gender-grid { grid-template-columns: 1fr; } }

.system-card, .gender-card {
    background: rgba(24, 24, 32, 0.8); 
    border: 1px solid #FFD700; 
    border-radius: 16px;
    padding: 20px; cursor: pointer; color: #fff; text-align: left;
    transition: all 0.2s ease;
    backdrop-filter: blur(5px);
}
.system-card:hover, .gender-card:hover { 
    background: rgba(34, 34, 45, 0.9); 
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(255, 215, 0, 0.15);
}
.system-card.locked { border-color: #444; opacity: 0.6; cursor: not-allowed; }
.system-card.locked:hover { transform: none; box-shadow: none; }
.system-name, .gender-label { font-weight: bold; font-size: 18px; color: #FFD700; margin-bottom: 6px; }
.system-card.locked .system-name { color: #888; }
.system-desc, .gender-desc { font-size: 14px; color: #ccc; }
.system-tag {
    display: inline-block; margin-top: 10px; font-size: 12px;
    padding: 4px 10px; border-radius: 999px; background: rgba(100, 255, 100, 0.1); color: #67ff9a; border: 1px solid rgba(100, 255, 100, 0.3);
}
.system-card.locked .system-tag { color: #888; background: rgba(255,255,255,0.05); border-color: #444; }
.gender-icon { font-size: 52px; margin-bottom: 10px; }

/* Game Screen & Avatar */
.top-panel {
    display: flex; align-items: center; gap: 20px;
    background: rgba(24, 24, 32, 0.8); border: 1px solid #333; border-radius: 16px; padding: 20px; margin-bottom: 16px;
    backdrop-filter: blur(5px);
}
.avatar-container {
    width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid #FFD700; overflow: hidden; background: #222;
    flex-shrink: 0; box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
}
.avatar-img { width: 100%; height: 100%; object-fit: cover; }
.player-info { flex: 1; }
.money { font-size: 36px; font-weight: bold; margin: 4px 0; color: #67ff9a; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
.sub { color: #aaa; font-size: 14px; }

/* Buttons */
button { 
    background: linear-gradient(135deg, #FFD700, #FFA500); 
    border: none; border-radius: 10px; padding: 12px 18px; 
    margin: 6px 6px 0 0; font-weight: bold; cursor: pointer; color: #000;
    transition: all 0.2s; font-size: 14px;
}
button:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3); }
button:active { transform: translateY(1px); }
.btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
.btn-back { background: linear-gradient(135deg, #555, #333); color: #fff; }

.save-status { font-size: 12px; color: #666; margin-top: 8px; display: flex; align-items: center; gap: 6px; }
.save-status.ok { color: #67ff9a; }
.save-status.err { color: #e74c3c; }

/* Mall */
.mall-header { text-align: center; margin-bottom: 16px; padding: 20px; background: rgba(255, 215, 0, 0.05); border-radius: 12px; border: 1px solid rgba(255, 215, 0, 0.2); }
.mall-header h1 { font-size: 28px; margin-bottom: 4px; }
.floor-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.floor-tab {
    background: rgba(34, 34, 45, 0.8); border: 1px solid #444; border-radius: 8px;
    padding: 10px 16px; cursor: pointer; font-size: 14px; color: #ccc; transition: all 0.2s;
}
.floor-tab.active { background: #FFD700; color: #000; border-color: #FFD700; font-weight: bold; box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3); }
.floor-tab:hover:not(.active) { background: #333; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.item-card { 
    background: rgba(34, 34, 45, 0.8); border-radius: 14px; overflow: hidden; 
    display: flex; flex-direction: column; border: 1px solid #333;
    transition: all 0.2s;
}
.item-card:hover { border-color: #FFD700; transform: translateY(-2px); }
.item-icon { 
    width: 100%; height: 110px; 
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
    border-bottom: 1px solid #333;
}
.item-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
.item-brand { font-size: 11px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.item-name { font-weight: bold; margin-bottom: 6px; font-size: 14px; line-height: 1.3; }
.item-price { color: #FFD700; font-size: 15px; font-weight: bold; margin-bottom: 10px; }
.item-card button { margin: 0; width: 100%; margin-top: auto; font-size: 13px; padding: 10px; }

/* Logs & Columns */
.columns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 16px; }
@media(max-width: 900px){ .columns { grid-template-columns: 1fr; } }
.panel { background: rgba(24, 24, 32, 0.8); border: 1px solid #333; border-radius: 14px; padding: 16px; backdrop-filter: blur(5px); }
.log { max-height: 250px; overflow-y: auto; padding-right: 8px; }
.log::-webkit-scrollbar { width: 6px; }
.log::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

.message { background: rgba(34, 34, 45, 0.6); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; line-height: 1.5; border-left: 4px solid #555; }
.message.system { border-left-color: #FFD700; }
.message.sms { border-left-color: #4da6ff; }
.message.event { border-left-color: #67ff9a; }

/* Popup */
.popup { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(4px); }
.popup-box {
    width: min(90vw, 400px); background: linear-gradient(135deg, #1a1a2e, #101018); 
    border: 2px solid #FFD700; border-radius: 20px; padding: 28px; 
    text-align: center; white-space: pre-line; line-height: 1.6;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}
.popup-box button { margin-top: 20px; width: 100%; padding: 14px; font-size: 16px; }
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyBvXijgpC-Pc5sbcXvGSTuurU6EER9I8HI",
    authDomain: "yh-payroll.firebaseapp.com",
    projectId: "yh-payroll",
    storageBucket: "yh-payroll.firebasestorage.app",
    messagingSenderId: "1041244524681",
    appId: "1:1041244524681:web:3e3f64d6a7cf34656df658",
    measurementId: "G-E16PE94YYC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function getPlayerId() {
    let id = localStorage.getItem('richSystem_playerId');
    if (!id) {
        id = 'player_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('richSystem_playerId', id);
    }
    return id;
}

const PLAYER_ID = getPlayerId();

window.firebaseSave = async function(data) {
    try {
        await setDoc(doc(db, 'richSystemSaves', PLAYER_ID), { ...data, updatedAt: Date.now() });
        updateSaveStatus('ok', '☁️ บันทึกแล้ว (' + new Date().toLocaleTimeString('th-TH') + ')');
    } catch (e) {
        console.error('Firebase save error:', e);
        updateSaveStatus('err', '⚠️ บันทึกไม่สำเร็จ (offline?)');
        localStorage.setItem('richSystemSave_v2', JSON.stringify(data));
    }
};

window.firebaseLoad = async function() {
    try {
        const snap = await getDoc(doc(db, 'richSystemSaves', PLAYER_ID));
        if (snap.exists()) {
            updateSaveStatus('ok', '☁️ โหลดเซฟจาก Cloud สำเร็จ');
            return snap.data();
        }
        return null;
    } catch (e) {
        console.error('Firebase load error:', e);
        updateSaveStatus('err', '⚠️ โหลดจาก Cloud ไม่ได้ ใช้เซฟในเครื่อง');
        const raw = localStorage.getItem('richSystemSave_v2');
        if (raw) return JSON.parse(raw);
        return null;
    }
};

function updateSaveStatus(cls, text) {
    const el = document.getElementById('saveStatus');
    if (el) { el.className = 'save-status ' + cls; el.textContent = text; }
}

window.firebaseReady = true;
window.dispatchEvent(new Event('firebaseReady'));
</script>

// ═══ ตัวแปรเกม ═══
let money = 1000;
let totalSpent = 0;
let pendingCashbacks = [];
let playerGender = '';
let selectedSystem = '';
let gameStarted = false;
let currentFloor = 0;
let purchaseHistory = [];
let visitedFloors = new Set();
let saveTimeout = null;
const flags = { firstWork: false, firstPurchase: false, spent1000: false, luxuryPurchase: false, visitMall: false, allFloors: false };
const popupQueue = [];
let popupActive = false;

function format(n) { return n.toLocaleString('th-TH'); }
function getGenderText() {
    if (playerGender === 'male') return 'ชาย';
    if (playerGender === 'female') return 'หญิง';
    return '-';
}

function getAvatarUrl() {
    // ใช้ DiceBear API สำหรับสร้าง Avatar สวยๆ ฟรี
    const style = 'avataaars';
    const seed = playerGender === 'male' ? 'male-rich' : 'female-rich';
    return `https://api.dicebear.com/7.x/${style}/svg?seed=${seed}&backgroundColor=b6e3f4`;
}

function update() {
    document.getElementById('money').textContent = format(money) + ' บาท';
    document.getElementById('spent').textContent = 'ใช้จ่ายรวม: ' + format(totalSpent) + ' บาท';
    saveGame();
}

function saveGame() {
    const data = {
        money, totalSpent, playerGender, selectedSystem,
        flags: { ...flags }, gameStarted,
        purchaseHistory: purchaseHistory.slice(-50)
    };
    localStorage.setItem('richSystemSave_v2', JSON.stringify(data));
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
        if (window.firebaseSave) window.firebaseSave(data);
    }, 1000);
}

async function loadGame() {
    let data = null;
    if (window.firebaseLoad) data = await window.firebaseLoad();
    if (!data) {
        const raw = localStorage.getItem('richSystemSave_v2');
        if (raw) { try { data = JSON.parse(raw); } catch (e) {} }
    }
    if (!data) return false;
    money = data.money ?? 1000;
    totalSpent = data.totalSpent ?? 0;
    playerGender = data.playerGender ?? '';
    selectedSystem = data.selectedSystem ?? '';
    gameStarted = data.gameStarted ?? false;
    purchaseHistory = data.purchaseHistory ?? [];
    if (data.flags) Object.keys(flags).forEach(k => { flags[k] = data.flags[k] ?? false; });
    return true;
}

function resetGame() {
    if (confirm('ต้องการรีเซ็ตเกมทั้งหมด? ข้อมูลจะถูกลบถาวร')) {
        localStorage.removeItem('richSystemSave_v2');
        if (window.firebaseSave) {
            window.firebaseSave({ money: 1000, totalSpent: 0, playerGender: '', selectedSystem: '',
                flags: { firstWork: false, firstPurchase: false, spent1000: false, luxuryPurchase: false, visitMall: false, allFloors: false },
                gameStarted: false, purchaseHistory: []
            });
        }
        location.reload();
    }
}

function addLog(id, cls, text) {
    const box = document.getElementById(id);
    const div = document.createElement('div');
    div.className = 'message ' + cls;
    div.textContent = text;
    box.prepend(div);
}
const addSystem = t => addLog('systemLog', 'system', t);
const addSms = t => addLog('smsLog', 'sms', t);
const addEvent = t => addLog('eventLog', 'event', t);

function queuePopup(text) {
    popupQueue.push(text);
    if (!popupActive) showNextPopup();
}
function showNextPopup() {
    const popup = document.getElementById('popup');
    if (popupQueue.length === 0) { popupActive = false; popup.classList.add('hidden'); return; }
    popupActive = true;
    document.getElementById('popupText').textContent = popupQueue[0];
    popup.classList.remove('hidden');
}
function closePopup() { popupQueue.shift(); showNextPopup(); }

// ═══ ระบบห้าง ═══
function openMall() {
    document.getElementById('mallPanel').classList.remove('hidden');
    visitedFloors.add(currentFloor);
    if (!flags.visitMall) {
        flags.visitMall = true;
        addEvent('ปลดล็อก: เข้าห้าง Rich Mall ครั้งแรก');
        addSms('Rich System: ปลดล็อกเหตุการณ์ เข้าห้าง Rich Mall');
        queuePopup('🎉 ปลดล็อกเหตุการณ์\nเข้าห้าง Rich Mall ครั้งแรก\nยินดีต้อนรับสู่ห้างสรรพสินค้าสุดหรู!');
    }
    renderFloorTabs();
    renderShop();
    saveGame();
}
function closeMall() {
    document.getElementById('mallPanel').classList.add('hidden');
}
function renderFloorTabs() {
    const tabs = document.getElementById('floorTabs');
    tabs.innerHTML = '';
    MALL_FLOORS.forEach((floor, i) => {
        const btn = document.createElement('button');
        btn.className = 'floor-tab' + (i === currentFloor ? ' active' : '');
        btn.textContent = floor.name;
        btn.onclick = () => { currentFloor = i; visitedFloors.add(i); renderFloorTabs(); renderShop(); };
        tabs.appendChild(btn);
    });
}
function renderShop() {
    const shop = document.getElementById('shop');
    shop.innerHTML = '';
    const items = MALL_FLOORS[currentFloor].items;
    items.forEach((item, i) => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
            <div class="item-icon">${item.icon}</div>
            <div class="item-body">
                <div class="item-brand">${item.brand}</div>
                <div class="item-name">${item.name}</div>
                <div class="item-price">${format(item.price)} บาท</div>
                <button onclick="buyItem(${currentFloor}, ${i})">ซื้อเลย</button>
            </div>`;
        shop.appendChild(card);
    });
}

// ═══ ระบบซื้อของ ═══
function buyItem(floorIdx, itemIdx) {
    const item = MALL_FLOORS[floorIdx].items[itemIdx];
    if (money < item.price) {
        queuePopup('❌ เงินสดไม่พอ\nราคา: ' + format(item.price) + ' บาท\nมีเงิน: ' + format(money) + ' บาท');
        addSystem('[ระบบ] ธุรกรรมล้มเหลว: เงินไม่พอซื้อ ' + item.name);
        return;
    }
    money -= item.price;
    totalSpent += item.price;
    purchaseHistory.push({ name: item.name, brand: item.brand, price: item.price, time: Date.now() });
    update();
    
    const cashback = item.price * 2;
    pendingCashbacks.push({ amount: cashback, payAt: Date.now() + 5000, status: 'pending' });
    
    queuePopup(`💳 [ระบบ] ตรวจพบการใช้จ่าย\nร้าน: ${item.brand}\nรายการ: ${item.name}\nจำนวน: ${format(item.price)} บาท\n\n💰 เงินคืน ${format(cashback)} บาท จะเข้าใน 5 วินาที`);
    addSystem('[ระบบ] ซื้อ ' + item.name + ' (' + item.brand + ') ' + format(item.price) + ' บาท');
    addSms('ธนาคาร: จ่าย ' + format(item.price) + ' บาท ที่ ' + item.brand);
    unlockAfterPurchase(item.price);
    saveGame();
}

// ═══ ระบบเงินคืน ═══
function processCashbacks() {
    const now = Date.now();
    pendingCashbacks.forEach(c => {
        if (c.status === 'pending' && now >= c.payAt) {
            c.status = 'completed';
            money += c.amount;
            addSystem('[ระบบ] 💸 เงินคืน ' + format(c.amount) + ' บาทเข้าบัญชีแล้ว');
            addSms('ธนาคาร: เงินเข้า ' + format(c.amount) + ' บาท (เงินคืน)');
            update();
        }
    });
}
setInterval(processCashbacks, 250);

// ═══ ปลดล็อกเหตุการณ์ ═══
function unlockAfterPurchase(price) {
    if (!flags.firstPurchase) {
        flags.firstPurchase = true;
        addEvent('ปลดล็อก: การใช้จ่ายครั้งแรก');
        queuePopup('🔓 ปลดล็อกเหตุการณ์\nการใช้จ่ายครั้งแรก\nโลกเริ่มตอบสนองต่อการใช้จ่ายของคุณแล้ว');
    }
    if (!flags.spent1000 && totalSpent >= 1000) {
        flags.spent1000 = true;
        addEvent('ปลดล็อก: เริ่มใช้เงินเป็น (ครบ 1,000)');
        queuePopup('🔓 ปลดล็อกเหตุการณ์\nเริ่มใช้เงินเป็น\nคุณใช้จ่ายรวมครบ 1,000 บาทแล้ว');
    }
    if (!flags.luxuryPurchase && price >= 5000) {
        flags.luxuryPurchase = true;
        addEvent('ปลดล็อก: ของหรูชิ้นแรก (5,000+)');
        queuePopup('🔓 ปลดล็อกเหตุการณ์\nของหรูชิ้นแรก\nพนักงานเริ่มจดจำคุณได้แล้ว');
    }
    if (!flags.allFloors && visitedFloors.size >= MALL_FLOORS.length) {
        flags.allFloors = true;
        addEvent('ปลดล็อก: สำรวจห้างครบทุกชั้น');
        queuePopup('🔓 ปลดล็อกเหตุการณ์\nสำรวจห้างครบทุกชั้น\nคุณรู้จักทุกมุมของ Rich Mall แล้ว!');
    }
}

// ═══ ทำงาน ═══
function earn() {
    money += 200;
    update();
    addSystem('[ระบบ] 💼 ทำงานสำเร็จ +200 บาท');
    addSms('ธนาคาร: เงินเข้า 200 บาท');
    if (!flags.firstWork) {
        flags.firstWork = true;
        addEvent('ปลดล็อก: งานแรกของคุณ');
        queuePopup('🔓 ปลดล็อกเหตุการณ์\nงานแรกของคุณ\nคุณเริ่มมีเงินสำหรับใช้จ่ายแล้ว');
    }
    saveGame();
}

// ═══ Flow เกม ═══
function chooseSystem(id) {
    if (id !== 'cashback') {
        queuePopup('🔒 ระบบนี้ยังไม่ได้เปิดใน prototype นี้\nเร็ว ๆ นี้');
        return;
    }
    selectedSystem = id;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('genderScreen').classList.remove('hidden');
}

function chooseGender(gender) {
    playerGender = gender;
    gameStarted = true;
    document.getElementById('genderScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    
    // อัปเดต Avatar และข้อมูล
    document.getElementById('playerAvatar').src = getAvatarUrl();
    document.getElementById('systemName').textContent = 'ระบบเงินคืน';
    document.getElementById('playerGender').textContent = getGenderText();
    
    addSystem('[ระบบ] เปิดระบบเงินคืน | เพศ ' + getGenderText());
    addSms('Rich System: ยินดีต้อนรับ คุณ' + getGenderText());
    queuePopup('💎 [ระบบ] เปิดใช้งานระบบเงินคืน\nตัวละคร: เพศ ' + getGenderText() + '\nใช้เงิน 100 ได้คืน 200\n\n💡 กด "เข้าห้าง Rich Mall" เพื่อช้อปปิ้ง!');
    saveGame();
}

// ═══ เริ่มต้นเกม ═══
async function initGame() {
    await new Promise(resolve => {
        if (window.firebaseReady) return resolve();
        const timer = setTimeout(resolve, 3000);
        window.addEventListener('firebaseReady', () => { clearTimeout(timer); resolve(); });
    });
    
    const hasSave = await loadGame();
    if (hasSave && gameStarted && playerGender) {
        document.getElementById('startScreen').classList.add('hidden');
        document.getElementById('genderScreen').classList.add('hidden');
        document.getElementById('gameScreen').classList.remove('hidden');
        document.getElementById('playerAvatar').src = getAvatarUrl();
        document.getElementById('systemName').textContent = 'ระบบเงินคืน';
        document.getElementById('playerGender').textContent = getGenderText();
        addSystem('[ระบบ] โหลดเซฟจาก Cloud สำเร็จ ยินดีต้อนรับกลับ!');
    }
    
    renderFloorTabs();
    renderShop();
    update();
}

initGame();
</script>
