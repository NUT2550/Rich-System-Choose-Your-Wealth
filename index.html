<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ─── Firebase Config ของคุณ ───
const firebaseConfig = {
  apiKey: "AIzaSyBvXijgpC-Pc5sbcXvGSTuurU6EER9I8HI",
  authDomain: "yh-payroll.firebaseapp.com",
  projectId: "yh-payroll",
  storageBucket: "yh-payroll.firebasestorage.app",
  messagingSenderId: "1041244524681",
  appId: "1:1041244524681:web:3e3f64d6a7cf34656df658",
  measurementId: "G-E16PE94YYC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ─── สร้าง User ID เฉพาะเครื่อง (เก็บใน localStorage) ───
function getPlayerId(){
  let id = localStorage.getItem('richSystem_playerId');
  if(!id){
    id = 'player_' + Date.now() + '_' + Math.random().toString(36).substr(2,9);
    localStorage.setItem('richSystem_playerId', id);
  }
  return id;
}
const PLAYER_ID = getPlayerId();

// ─── บันทึกข้อมูลลง Firestore ───
window.firebaseSave = async function(data){
  try {
    await setDoc(doc(db, 'richSystemSaves', PLAYER_ID), {
      ...data,
      updatedAt: Date.now()
    });
    updateSaveStatus('ok','☁️ บันทึกแล้ว ('+new Date().toLocaleTimeString('th-TH')+')');
  } catch(e){
    console.error('Firebase save error:', e);
    updateSaveStatus('err','⚠️ บันทึกไม่สำเร็จ (offline?)');
    // fallback: localStorage
    localStorage.setItem('richSystemSave_v2', JSON.stringify(data));
  }
};

// ─── โหลดข้อมูลจาก Firestore ───
window.firebaseLoad = async function(){
  try {
    const snap = await getDoc(doc(db, 'richSystemSaves', PLAYER_ID));
    if(snap.exists()){
      updateSaveStatus('ok','☁️ โหลดเซฟจาก Cloud สำเร็จ');
      return snap.data();
    }
    return null;
  } catch(e){
    console.error('Firebase load error:', e);
    updateSaveStatus('err','⚠️ โหลดจาก Cloud ไม่ได้ ใช้เซฟในเครื่อง');
    // fallback: localStorage
    const raw = localStorage.getItem('richSystemSave_v2');
    if(raw) return JSON.parse(raw);
    return null;
  }
};

// ─── อัปเดตสถานะการบันทึก ───
function updateSaveStatus(cls, text){
  const el = document.getElementById('saveStatus');
  if(el){ el.className='save-status '+cls; el.textContent=text; }
}

// ─── แจ้งว่า Firebase พร้อม ───
window.firebaseReady = true;
window.dispatchEvent(new Event('firebaseReady'));
</script>

// ═══ ตัวแปรเกม ═══
let money = 1000;
let totalSpent = 0;
let pendingCashbacks = [];
let playerGender = '';
let selectedSystem = '';
let gameStarted = false;
let currentFloor = 0;
let purchaseHistory = [];
let visitedFloors = new Set();
let saveTimeout = null;

const flags = { firstWork:false, firstPurchase:false, spent1000:false, luxuryPurchase:false, visitMall:false, allFloors:false };
const popupQueue = [];
let popupActive = false;

function format(n){ return n.toLocaleString('th-TH'); }
function getGenderText(){
  if(playerGender==='male') return 'ชาย';
  if(playerGender==='female') return 'หญิง';
  return '-';
}

function update(){
  document.getElementById('money').textContent = format(money)+' บาท';
  document.getElementById('spent').textContent = 'ใช้จ่ายรวม: '+format(totalSpent)+' บาท';
  saveGame();
}

// ═══ ระบบบันทึก (Firebase + localStorage fallback) ═══
function saveGame(){
  const data = {
    money, totalSpent, playerGender, selectedSystem,
    flags: {...flags}, gameStarted,
    purchaseHistory: purchaseHistory.slice(-50) // เก็บ 50 รายการล่าสุด
  };

  // บันทึก localStorage เสมอ (backup)
  localStorage.setItem('richSystemSave_v2', JSON.stringify(data));

  // บันทึก Firebase (debounce 1 วินาที เพื่อไม่ให้เรียกบ่อยเกิน)
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(()=>{
    if(window.firebaseSave){
      window.firebaseSave(data);
    }
  }, 1000);
}

async function loadGame(){
  let data = null;

  // ลองโหลดจาก Firebase ก่อน
  if(window.firebaseLoad){
    data = await window.firebaseLoad();
  }

  // ถ้าไม่ได้จาก Firebase ลอง localStorage
  if(!data){
    const raw = localStorage.getItem('richSystemSave_v2');
    if(raw){ try{ data=JSON.parse(raw); }catch(e){} }
  }

  if(!data) return false;

  money = data.money ?? 1000;
  totalSpent = data.totalSpent ?? 0;
  playerGender = data.playerGender ?? '';
  selectedSystem = data.selectedSystem ?? '';
  gameStarted = data.gameStarted ?? false;
  purchaseHistory = data.purchaseHistory ?? [];
  if(data.flags){
    Object.keys(flags).forEach(k=>{ flags[k]=data.flags[k]??false; });
  }
  return true;
}

function resetGame(){
  if(confirm('ต้องการรีเซ็ตเกมทั้งหมด? ข้อมูลจะถูกลบถาวร')){
    localStorage.removeItem('richSystemSave_v2');
    // ลบจาก Firebase ด้วย
    if(window.firebaseSave){
      window.firebaseSave({ money:1000, totalSpent:0, playerGender:'', selectedSystem:'',
        flags:{firstWork:false,firstPurchase:false,spent1000:false,luxuryPurchase:false,visitMall:false,allFloors:false},
        gameStarted:false, purchaseHistory:[]
      });
    }
    location.reload();
  }
}

// ═══ UI Helpers ═══
function addLog(id,cls,text){
  const box=document.getElementById(id);
  const div=document.createElement('div');
  div.className='message '+cls;
  div.textContent=text;
  box.prepend(div);
}
const addSystem = t=>addLog('systemLog','system',t);
const addSms    = t=>addLog('smsLog','sms',t);
const addEvent  = t=>addLog('eventLog','event',t);

function queuePopup(text){
  popupQueue.push(text);
  if(!popupActive) showNextPopup();
}
function showNextPopup(){
  const popup=document.getElementById('popup');
  if(popupQueue.length===0){ popupActive=false; popup.classList.add('hidden'); return; }
  popupActive=true;
  document.getElementById('popupText').textContent=popupQueue[0];
  popup.classList.remove('hidden');
}
function closePopup(){ popupQueue.shift(); showNextPopup(); }

    queuePopup('ปลดล็อกเหตุการณ์\nเข้าห้าง Rich Mall ครั้งแรก\nยินดีต้อนรับสู่ห้างสรรพสินค้าสุดหรู!');
  }
  renderFloorTabs();
  renderShop();
  saveGame();
}
function closeMall(){
  document.getElementById('mallPanel').classList.add('hidden');
}
function renderFloorTabs(){
  const tabs=document.getElementById('floorTabs');
  tabs.innerHTML='';
  MALL_FLOORS.forEach((floor,i)=>{
    const btn=document.createElement('button');
    btn.className='floor-tab'+(i===currentFloor?' active':'');
    btn.textContent=floor.name;
    btn.onclick=()=>{ currentFloor=i; visitedFloors.add(i); renderFloorTabs(); renderShop(); };
    tabs.appendChild(btn);
  });
}
function renderShop(){
  const shop=document.getElementById('shop');
  shop.innerHTML='';
  const items=MALL_FLOORS[currentFloor].items;
  items.forEach((item,i)=>{
    const card=document.createElement('div');
    card.className='item-card';
    card.innerHTML=
      '<img src="'+item.img+'" alt="'+item.name+'" onerror="this.style.display=\'none\'">'+
      '<div class="item-body">'+
        '<div class="item-brand">'+item.brand+'</div>'+
        '<div class="item-name">'+item.name+'</div>'+
        '<div class="item-price">'+format(item.price)+' บาท</div>'+
        '<button onclick="buyItem('+currentFloor+','+i+')">ซื้อ</button>'+
      '</div>';
    shop.appendChild(card);
  });
}

// ═══ ระบบซื้อของ ═══
function buyItem(floorIdx,itemIdx){
  const item=MALL_FLOORS[floorIdx].items[itemIdx];
  if(money<item.price){
    queuePopup('เงินสดไม่พอ\nราคา: '+format(item.price)+' บาท\nมีเงิน: '+format(money)+' บาท');
    addSystem('[ระบบ] ธุรกรรมล้มเหลว: เงินไม่พอซื้อ '+item.name);
    return;
  }
  money-=item.price;
  totalSpent+=item.price;
  purchaseHistory.push({name:item.name,brand:item.brand,price:item.price,time:Date.now()});
  update();

  const cashback=item.price*2;
  pendingCashbacks.push({amount:cashback,payAt:Date.now()+5000,status:'pending'});

  queuePopup('[ระบบ] ตรวจพบการใช้จ่าย\nร้าน: '+item.brand+'\nรายการ: '+item.name+'\nจำนวน: '+format(item.price)+' บาท\nเงินคืน '+format(cashback)+' บาท จะเข้าใน 5 วิ');
  addSystem('[ระบบ] ซื้อ '+item.name+' ('+item.brand+') '+format(item.price)+' บาท');
  addSms('ธนาคาร: จ่าย '+format(item.price)+' บาท ที่ '+item.brand);
  unlockAfterPurchase(item.price);
  saveGame();
}

// ═══ ระบบเงินคืน ═══
function processCashbacks(){
  const now=Date.now();
  pendingCashbacks.forEach(c=>{
    if(c.status==='pending'&&now>=c.payAt){
      c.status='completed';
      money+=c.amount;
      addSystem('[ระบบ] เงินคืน '+format(c.amount)+' บาทเข้าบัญชีแล้ว');
      addSms('ธนาคาร: เงินเข้า '+format(c.amount)+' บาท (เงินคืน)');
      update();
    }
  });
}
setInterval(processCashbacks,250);

// ═══ ปลดล็อกเหตุการณ์ ═══
function unlockAfterPurchase(price){
  if(!flags.firstPurchase){
    flags.firstPurchase=true;
    addEvent('ปลดล็อก: การใช้จ่ายครั้งแรก');
    queuePopup('ปลดล็อกเหตุการณ์\nการใช้จ่ายครั้งแรก\nโลกเริ่มตอบสนองต่อการใช้จ่ายของคุณแล้ว');
  }
  if(!flags.spent1000&&totalSpent>=1000){
    flags.spent1000=true;
    addEvent('ปลดล็อก: เริ่มใช้เงินเป็น (ครบ 1,000)');
    queuePopup('ปลดล็อกเหตุการณ์\nเริ่มใช้เงินเป็น\nคุณใช้จ่ายรวมครบ 1,000 บาทแล้ว');
  }
  if(!flags.luxuryPurchase&&price>=5000){
    flags.luxuryPurchase=true;
    addEvent('ปลดล็อก: ของหรูชิ้นแรก (5,000+)');
    queuePopup('ปลดล็อกเหตุการณ์\nของหรูชิ้นแรก\nพนักงานเริ่มจดจำคุณได้แล้ว');
  }
  if(!flags.allFloors&&visitedFloors.size>=MALL_FLOORS.length){
    flags.allFloors=true;
    addEvent('ปลดล็อก: สำรวจห้างครบทุกชั้น');
    queuePopup('ปลดล็อกเหตุการณ์\nสำรวจห้างครบทุกชั้น\nคุณรู้จักทุกมุมของ Rich Mall แล้ว!');
  }
}

// ═══ ทำงาน ═══
function earn(){
  money+=200;
  update();
  addSystem('[ระบบ] ทำงานสำเร็จ +200 บาท');
  addSms('ธนาคาร: เงินเข้า 200 บาท');
  if(!flags.firstWork){
    flags.firstWork=true;
    addEvent('ปลดล็อก: งานแรกของคุณ');
    queuePopup('ปลดล็อกเหตุการณ์\nงานแรกของคุณ\nคุณเริ่มมีเงินสำหรับใช้จ่ายแล้ว');
  }
  saveGame();
}

// ═══ Flow เกม ═══
function chooseSystem(id){
  if(id!=='cashback'){
    queuePopup('ระบบนี้ยังไม่ได้เปิดใน prototype นี้\nเร็ว ๆ นี้');
    return;
  }
  selectedSystem=id;
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('genderScreen').classList.remove('hidden');
}

function chooseGender(gender){
  playerGender=gender;
  gameStarted=true;
  document.getElementById('genderScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  document.getElementById('systemName').textContent='ระบบเงินคืน';
  document.getElementById('playerGender').textContent=getGenderText();
  addSystem('[ระบบ] เปิดระบบเงินคืน | เพศ'+getGenderText());
  addSms('Rich System: ยินดีต้อนรับ คุณ'+getGenderText());
  queuePopup('[ระบบ] เปิดใช้งานระบบเงินคืน\nตัวละคร: เพศ'+getGenderText()+'\nใช้เงิน 100 ได้คืน 200\n\n💡 กด "เข้าห้าง Rich Mall" เพื่อช้อปปิ้ง!');
  saveGame();
}

// ═══ เริ่มต้นเกม ═══
async function initGame(){
  // รอ Firebase พร้อม (หรือ timeout 3 วิ)
  await new Promise(resolve=>{
    if(window.firebaseReady) return resolve();
    const timer = setTimeout(resolve, 3000);
    window.addEventListener('firebaseReady', ()=>{ clearTimeout(timer); resolve(); });
  });

  const hasSave = await loadGame();

  if(hasSave&&gameStarted&&playerGender){
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('genderScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('systemName').textContent='ระบบเงินคืน';
    document.getElementById('playerGender').textContent=getGenderText();
    addSystem('[ระบบ] โหลดเซฟจาก Cloud สำเร็จ ยินดีต้อนรับกลับ!');
  }

  renderFloorTabs();
  renderShop();
  update();
}

initGame();
</script>
