<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rich System 4.8 — 3D World (Three.js)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/noto-sans-thai@latest/index.css">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<style>
:root{--bg:#0b0b10;--panel:#16161f;--panel2:#1d1d29;--line:#2c2c3a;--gold:#f5c542;--gold2:#ffd77a;--txt:#f2f2f7;--dim:#9a9ab0;--green:#67ff9a;--red:#ff6b6b;--blue:#4da6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(1200px 500px at 80% -10%,rgba(245,197,66,.08),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(77,166,255,.06),transparent 60%),var(--bg);color:var(--txt);font-family:'Noto Sans Thai',sans-serif;min-height:100vh}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#33334a;border-radius:8px}
.start-screen{position:fixed;inset:0;z-index:500;background:radial-gradient(900px 420px at 50% -10%,rgba(245,197,66,.15),transparent 60%),#0a0a0f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.start-logo{font-size:44px;font-weight:800;background:linear-gradient(180deg,#ffe9a8,#f5c542 55%,#b8860b);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(245,197,66,.35));margin:0}
.start-sub{color:var(--dim);margin:6px 0 18px}
.name-row{margin-bottom:18px}
.name-row input{background:#14141d;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:10px 14px;font:inherit;outline:none;width:230px;text-align:center}
.system-grid{display:grid;grid-template-columns:repeat(2,minmax(230px,300px));gap:14px}
@media(max-width:640px){.system-grid{grid-template-columns:1fr}}
.system-card{background:linear-gradient(180deg,#1a1a26,#14141d);border:1px solid var(--gold);border-radius:16px;padding:18px;cursor:pointer;color:var(--txt);text-align:left;transition:.2s}
.system-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(245,197,66,.2)}
.system-name{font-weight:800;font-size:18px;color:var(--gold);margin-bottom:6px}
.system-desc{font-size:14px;color:#ccc}
.system-tag{display:inline-block;margin-top:10px;font-size:12px;padding:3px 10px;border-radius:999px;background:#2a2a35;color:var(--green)}
.start-foot{margin-top:20px;color:#666;font-size:12px}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:rgba(11,11,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.who-btn{display:flex;align-items:center;gap:10px;background:none;border:1px solid transparent;border-radius:14px;padding:4px 8px;cursor:pointer;color:var(--txt);font:inherit}
.who-btn:hover{border-color:var(--gold);background:#1a1a26}
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);flex:none;box-shadow:0 0 14px rgba(245,197,66,.35)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who{min-width:100px;text-align:left}
.who .pname{font-weight:800}
.who .ptitle{font-size:12px;color:var(--gold2)}
